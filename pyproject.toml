[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demon_accel"
version = "0.1.0"
description = "Stratified-admission acceleration of matrix products (anchor-subspace, certified low-rank serving, BLAS fallback)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
test = ["pytest", "scipy"]

[tool.setuptools]
packages = ["demon_accel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
